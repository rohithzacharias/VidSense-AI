[project]
name = "hacknex-vidsense-ai"
version = "0.1.0"
description = "Video Understanding & Temporal Reasoning — VidSense AI"
readme = "README.md"
authors = [
    { name = "rohithzacharias", email = "rohithzacharias@karunya.edu.in" }
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "ultralytics>=8.2",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "lapx>=0.5",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pymongo>=4.6.0",
    "groq>=0.5.0",
    "httpx>=0.27.0",
    "llama-cpp-python>=0.3",
]

[project.scripts]
vidsense-pipeline = "backend.pipeline.process_video:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
